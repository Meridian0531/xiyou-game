<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090c0b;color:#f8f4e7;font-family:"Microsoft YaHei","PingFang SC",sans-serif;user-select:none;touch-action:none}button{font:inherit;color:inherit}.game{position:relative;width:100%;height:100%;isolation:isolate;background:#0d1412}canvas{position:absolute;inset:0;width:100%;height:100%}.top{position:absolute;z-index:4;top:0;left:0;right:0;padding:max(12px,env(safe-area-inset-top)) 14px 0;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;pointer-events:none}.brand{display:flex;gap:9px;align-items:center;text-shadow:0 2px 8px #000}.seal{width:32px;height:32px;border:1px solid #ffce72;background:#b83c2d;display:grid;place-items:center;font-family:serif;font-size:18px;box-shadow:inset 0 0 0 3px #8d261e}.brand b{display:block;font-family:serif;font-size:18px;letter-spacing:2px}.brand small{display:block;margin-top:1px;color:#b7c0b7;font-size:9px;letter-spacing:1px}.wave{text-align:center;text-shadow:0 2px 7px #000}.wave b{display:block;font-size:12px;color:#ffd988;letter-spacing:2px}.wave span{font-family:Georgia,serif;font-size:22px;font-weight:700}.tools{justify-self:end;display:flex;gap:7px;pointer-events:auto}.icon{width:36px;height:36px;border:1px solid #ffffff1c;background:#0c1210b8;border-radius:6px;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(8px)}.icon:hover{border-color:#efca6b99}.icon svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2}.stats{position:absolute;z-index:4;top:68px;left:14px;width:min(210px,46vw);pointer-events:none}.barrow{display:grid;grid-template-columns:34px 1fr auto;gap:7px;align-items:center;margin-bottom:7px;font-size:11px;text-shadow:0 1px 5px #000}.label{color:#d5ccad}.track{height:8px;background:#08100ecf;border:1px solid #ffffff1a;overflow:hidden;transform:skewX(-12deg)}.fill{height:100%;transition:width .16s}.hp{background:linear-gradient(90deg,#9c2424,#ed6950)}.xp{background:linear-gr tom:5px;font-size:9px;color:#eedfb7}.cool{position:absolute;inset:0;border-radius:50%;background:#050706c9;transform-origin:50% 100%;transform:scaleY(0);pointer-events:none}.cdtext{position:absolute;font-weight:700;font-size:14px}.joy{position:absolute;z-index:5;left:16px;bottom:max(21px,env(safe-area-inset-bottom));width:112px;height:112px;border-radius:50%;border:1px solid #ffffff10;background:#07100d42;box-shadow:inset 0 0 25px #0006;pointer-events:none}.joy:after{content:"";position:absolute;left:38px;top:38px;width:36px;height:36px;border-radius:50%;background:#e8d3a51c;border:1px solid #edd79144}.start,.modal{position:absolute;z-index:20;inset:0;display:grid;place-items:center;background:linear-gradient(#07100fc9,#080a09ed);backdrop-filter:blur(5px);padding:20px}.start.hide,.modal.hide{display:none}.panel{width:min(430px,92vw);text-align:center}.titlemark{font:700 clamp(40px,10vw,72px) serif;letter-spacing:8px;color:#f4d587;text-shadow:0 3px 0 #7c251d,0 10px 32px #000}.subtitle{margin:8px 0 30px;color:#bac4b7;font-size:12px;letter-spacing:6px}.hero-art{height:160px;position:relative;margin:0 auto 18px;width:220px}.moon{position:absolute;width:105px;height:105px;border-radius:50%;background:#e8d6a8;box-shadow:0 0 42px #f2cf7799;left:58px;top:8px}.monkey{position:absolute;left:85px;top:38px;font-size:80px;filter:drop-shadow(0 10px 10px #000)}.staff{position:absolute;width:170px;height:7px;background:linear-gradient(90deg,#d94b32,#f9d465 18% 82%,#d94b32);transform:rotate(-28deg);left:25px;top:90px;box-shadow:0 2px 5px #000}.cta{min-width:190px;border:1px solid #f4d081;background:#a83529;padding:13px 26px;border-radius:4px;font-weight:700;letter-spacing:4px;cursor:pointer;box-shadow:0 6px 22px #0008,inset 0 0 0 3px #84271f}.cta:hover{filter:brightness(1.12)}.how{margin-top:16px;color:#8e9a90;font-size:11px;line-height:1.8}.upgrade h2,.over h2{font:700 31px serif;color:#f2d281;letter-spacing:4px;margin:0 0 8px}.upgrade>p,.over>p{color:#aeb8ae;font-size:12px;margin:0 0 20px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{min-height:172px;border:1px solid #d7bb7152;background:#121916ef;border-radius:6px;padding:16px 10px;cursor:pointer;text-align:center;transition:.15s}.card:hover{transform:translateY(-4px);border-color:#f2cf79;background:#1a241f}.card i{display:grid;place-items:center;margin:0 auto 12px;width:48px;height:48px;border-radius:50%;background:#9e34283a;font:normal 25px serif}.card b{display:block;font-size:14px;color:#f7dc96}.card span{display:block;margin-top:8px;color:#9faa9f;font-size:11px;line-height:1.5}.result{font:700 42px Georgia,serif;color:#ffdd86;margin:14px}.result small{display:block;font:11px sans-serif;color:#9ea99f;letter-spacing:3px;margin-top:5px}.toast{position:absolute;z-index:8;left:50%;top:31%;transform:translate(-50%,-10px);font:700 24px serif;color:#ffe29a;text-shadow:0 3px 10px #000;opacity:0;pointer-events:none}.toast.show{animation:toast 1.3s ease}@keyframes toast{0%{opacity:0;transform:translate(-50%,8px) scale(.85)}20%,70%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-18px) scale(1.06)}}
@media(max-width:640px){.top{padding-left:10px;padding-right:10px}.brand small{display:none}.brand b{font-size:15px}.score{right:11px}.stats{left:11px;top:61px}.joy{width:94px;height:94px}.joy:after{left:31px;top:31px;width:32px;height:32px}.skill{width:53px;height:53px}.skill.primary{width:68px;height:68px}.skills{gap:7px}.cards{gap:6px}.card{padding:13px 6px;min-height:160px}.card span{font-size:10px}.panel{width:96vw}.hint{bottom:128px}}

<body>
<main class="game" id="game">
  <canvas id="canvas"></canvas>
  <header class="top">
    <div class="brand"><span class="seal">悟</span><span><b>西行·除妖录</b><small>JOURNEY OF DEMON SLAYING</small></span></div>
    <div class="wave"><b id="waveLabel">第一劫</b><span id="timer">00:00</span></div>
    <div class="tools">
      <button class="icon" id="soundBtn" title="声音" aria-label="声音"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4zM15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12"/></svg></button>
      <button class="icon" id="pauseBtn" title="暂停" aria-label="暂停"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
      <button class="icon" id="fullBtn" title="全屏" aria-label="全屏"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg></button>
    </div>
  </header>
  <section class="stats">
    <div class="barrow"><span class="label">气血</span><div class="track"><div class="fill hp" id="hpBar"></div></div><span class="num" id="hpNum">100</span></div>
    <div class="barrow"><span class="label">修为</span><div class="track"><div class="fill xp" id="xpBar"></div></div><span class="num" id="levelNum">1</span></div>
  </section>
  <div class="score"><b id="scoreNum">0</b><small>功德</small></div>
  <div class="combo" id="combo"><strong id="comboNum">x2</strong><span>连斩</span></div>
  <div class="bossbar" id="bossBar"><span id="bossName">牛魔王</span><div class="track"><div class="fill" id="bossFill"></div></div></div>
  <div class="hint" id="hint">拖动走位 · 自动挥棒除妖</div>
  <div class="joy" aria-hidden="true"></div>
  <div class="skills">
    <button class="skill" data-skill="dash" title="筋斗云"><span class="glyph">云</span><small>闪避</small><i class="cool"></i><em class="cdtext"></em></button>
    <button class="skill" data-skill="storm" title="棒扫千军"><span class="glyph">旋</span><small>棒阵</small><i class="cool"></i><em class="cdtext"></em></button>
    <button class="skill primary" data-skill="clone" title="身外化身"><span class="glyph">化</span><small>分身</small><i class="cool"></i><em class="cdtext"></em></button>
  </div>
  <div class="toast" id="toast"></div>
  <section class="start" id="start">
    <div class="panel">
      <div class="hero-art"><div class="moon"></div><div class="staff"></div><div class="monkey">🐒</div></div>
      <div class="titlemark">西行除妖</div><div class="subtitle">九九八十一难</div>
      <button class="cta" id="startBtn">踏上西行</button>
      <div class="how">电脑：WASD / 方向键走位，1 2 3 释放技能<br>手机：拖动屏幕走位，点击右下技能</div>
    </div>
  </section>
  <section class="modal hide" id="upgrade"><div class="panel upgrade"><h2>突破境界</h2><p>选择一项神通</p><div class="cards" id="cards"></div></div></section>
  <section class="modal hide" id="pause"><div class="panel over"><h2>暂离战场</h2><p>三界妖气已停滞</p><button class="cta" id="resumeBtn">继续除妖</button></div></section>
  <section class="modal hide" id="over"><div class="panel over"><h2>此难未渡</h2><div class="result" id="result">0<small>本局功德</small></div><p id="record">再试一次，方成大道</p><button class="cta" id="restartBtn">重走西行</button></div></section>
</main>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s), canvas=$('#canvas'),ctx=canvas.getContext('2d',{alpha:false});
const ui={start:$('#start'),upgrade:$('#upgrade'),pause:$('#pause'),over:$('#over'),hp:$('#hpBar'),xp:$('#xpBar'),hpNum:$('#hpNum'),level:$('#levelNum'),score:$('#scoreNum'),timer:$('#timer'),wave:$('#waveLabel'),combo:$('#combo'),comboNum:$('#comboNum'),boss:$('#bossBar'),bossFill:$('#bossFill'),bossName:$('#bossName'),hint:$('#hint'),toast:$('#toast'),cards:$('#cards')};
let W=0,H=0,DPR=1,last=0,elapsed=0,running=false,paused=false,muted=false,shake=0,flash=0,wave=1,spawnClock=0,bossSpawned=false,dragging=false,target={x:0,y:0},keys={},audio=null;
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const hero={x:0,y:0,r:20,hp:100,maxHp:100,level:1,xp:0,nextXp:45,score:0,speed:230,damage:18,rate:.52,attack:0,range:152,crit:.12,armor:0,magnet:105,combo:0,comboTime:0,inv:0,dash:0,storm:0,clone:0,clones:0};
let enemies=[],particles=[],orbs=[],slashes=[],rings=[],floaters=[],clouds=[],stars=[];
const skillCD={dash:0,storm:0,clone:0},skillMax={dash:4,storm:9,clone:15};
const upgrades=[
 {icon:'棒',name:'定海神针',desc:'攻击伤害 +35%',apply:()=>hero.damage*=1.35},
 {icon:'疾',name:'疾风棍法',desc:'攻击速度 +25%',apply:()=>hero.rate*=.75},
 {icon:'命',name:'金刚不坏',desc:'上限 +30，立即回满',apply:()=>{hero.maxHp+=30;hero.hp=hero.maxHp}},
 {icon:'爆',name:'火眼金睛',desc:'暴击率 +12%',apply:()=>hero.crit=Math.min(.7,hero.crit+.12)},
 {icon:'御',name:'护体毫毛',desc:'所受伤害 -15%',apply:()=>hero.armor=Math.min(.65,hero.armor+.15)},
 {icon:'灵',name:'天地灵气',desc:'拾取范围 +60%',apply:()=>hero.magnet*=1.6},
 {icon:'长',name:'如意长棒',desc:'攻击范围 +25%',apply:()=>hero.range*=1.25},
 {icon:'生',name:'菩提甘露',desc:'每秒恢复 1 点气血',apply:()=>hero.regen=(hero.regen||0)+1}
];
function resize(){const oldW=W,oldH=H;DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);if(hero.x&&oldW&&oldH){hero.x=clamp(hero.x/oldW*W,28,W-28);hero.y=clamp(hero.y/oldH*H,H*.2,H-58)}else{hero.x=W*.5;hero.y=H*.72}target.x=hero.x;target.y=hero.y;makeSky()}
function makeSky(){stars=Array.from({length:Math.floor(W*H/13000)},()=>({x:rnd(0,W),y:rnd(0,H*.62),a:rnd(.08,.5),r:rnd(.4,1.2)}));clouds=Array.from({length:7},()=>({x:rnd(-100,W),y:rnd(H*.12,H*.66),s:rnd(.5,1.4),v:rnd(3,9),a:rnd(.025,.09)}))}
function reset(){Object.assign(hero,{x:W*.5,y:H*.72,hp:100,maxHp:100,level:1,xp:0,nextXp:45,score:0,speed:230,damage:18,rate:.52,attack:0,range:152,crit:.12,armor:0,magnet:105,combo:0,comboTime:0,inv:0,dash:0,storm:0,clone:0,clones:0,regen:0});enemies=[];particles=[];orbs=[];slashes=[];rings=[];floaters=[];elapsed=0;wave=1;spawnClock=.65;bossSpawned=false;Object.keys(skillCD).forEach(k=>skillCD[k]=0);for(let i=0;i<3;i++){spawnEnemy(false);enemies[i].x=W*(.32+i*.18);enemies[i].y=H*(.43+i*.045)}updateUI()}
function startGame(){reset();ui.start.classList.add('hide');ui.over.classList.add('hide');ui.pause.classList.add('hide');ui.upgrade.classList.add('hide');running=true;paused=false;last=performance.now();ui.hint.style.opacity=1;setTimeout(()=>ui.hint.style.opacity=0,3500);tone(220,.08,'triangle',.05);requestAnimationFrame(loop)}
function tone(freq,dur=.08,type='sine',gain=.04){if(muted)return;try{audio=audio||new (AudioContext||webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);g.gain.setValueAtTime(gain,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch{}}
function spawnEnemy(forceBoss=false){const boss=forceBoss;const side=Math.random();let x,y;if(side<.7){x=rnd(35,W-35);y=-45}else{x=side<.85?-45:W+45;y=rnd(H*.18,H*.55)}const types=[{name:'小妖',color:'#4b8c63',hp:32,s:63,r:17,d:9},{name:'山魈',color:'#a54e3b',hp:60,s:48,r:22,d:14},{name:'蛛蛛精',color:'#845aa0',hp:44,s:78,r:18,d:11}];let t=types[Math.min(types.length-1,Math.floor(rnd(0,1+wave/3)))];if(boss)t={name:wave%10===0?'牛魔王':'黑风大王',color:'#7f2330',hp:620+wave*95,s:28,r:52,d:24};const scale=1+(wave-1)*.11;enemies.push({x,y,vx:0,vy:0,r:t.r,hp:t.hp*scale,maxHp:t.hp*scale,s:t.s*(1+wave*.015),damage:t.d*scale,color:t.color,name:t.name,boss,hit:0,attack:0,phase:rnd(0,6.28)});if(boss){ui.boss.classList.add('show');ui.bossName.textContent=t.name;toast(t.name+'·降临')};}
function burst(x,y,color,n=12,power=120){for(let i=0;i<n;i++){const a=rnd(0,Math.PI*2),s=rnd(power*.25,power);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.3,.75),max:.75,r:rnd(1,3),color})}}
function text(x,y,value,color='#fff',size=15){floaters.push({x,y,value,color,size,life:.8})}
function ring(x,y,color,max=120){rings.push({x,y,r:8,max,life:.65,color})}
function toast(v){ui.toast.textContent=v;ui.toast.classList.remove('show');void ui.toast.offsetWidth;ui.toast.classList.add('show')}
function hitEnemy(e,damage,heavy=false){const crit=Math.random()<hero.crit,amount=damage*(crit?2:1);e.hp-=amount;e.hit=.12;text(e.x,e.y-e.r,Math.round(amount),crit?'#ffe07b':'#fff',crit?21:14);burst(e.x,e.y,crit?'#ffd465':'#dcebd8',crit?12:5,heavy?180:90);if(crit)tone(440,.05,'square',.025);if(e.hp<=0)kill(e)}
function kill(e){const i=enemies.indexOf(e);if(i<0)return;enemies.splice(i,1);burst(e.x,e.y,e.color,e.boss?55:18,e.boss?260:150);ring(e.x,e.y,e.boss?'#ffd66b':'#ffffff88',e.boss?240:70);const gain=Math.round((e.boss?250:10)*(1+hero.combo*.04));hero.score+=gain;hero.combo++;hero.comboTime=2.6;for(let n=0;n<(e.boss?15:2);n++)orbs.push({x:e.x+rnd(-18,18),y:e.y+rnd(-18,18),vx:rnd(-35,35),vy:rnd(-40,10),r:e.boss?5:4,value:e.boss?10:5});if(e.boss){ui.boss.classList.remove('show');bossSpawned=true;shake=18;flash=.35;toast('大妖已除·功德无量');tone(110,.4,'sawtooth',.06)}else tone(170,.04,'triangle',.018)}
function attack(){let best=null,bd=hero.range;for(const e of enemies){const d=dist(hero,e);if(d<bd){best=e;bd=d}}if(!best)return;const a=Math.atan2(best.y-hero.y,best.x-hero.x);slashes.push({x:hero.x,y:hero.y,a,life:.2,len:bd+best.r});hitEnemy(best,hero.damage);hero.attack=hero.rate;tone(rnd(180,240),.035,'square',.015);if(hero.clones>0){for(let i=0;i<hero.clones;i++){const another=enemies[(enemies.indexOf(best)+i+1)%enemies.length];if(another&&another!==best)hitEnemy(another,hero.damage*.42)}}}
function useSkill(name){if(!running||paused||skillCD[name]>0)return;skillCD[name]=skillMax[name];if(name==='dash'){hero.inv=.65;hero.dash=.4;const dx=target.x-hero.x,dy=target.y-hero.y,d=Math.hypot(dx,dy)||1;hero.x=clamp(hero.x+dx/d*115,30,W-30);hero.y=clamp(hero.y+dy/d*115,H*.2,H-65);ring(hero.x,hero.y,'#b9f7df',85);burst(hero.x,hero.y,'#e9ffff',20,170);tone(480,.12,'sine',.04)}if(name==='storm'){hero.storm=1.2;ring(hero.x,hero.y,'#ffdc79',hero.range*1.5);enemies.slice().forEach(e=>{if(dist(hero,e)<hero.range*1.55)hitEnemy(e,hero.damage*2.2,true)});shake=11;tone(100,.25,'sawtooth',.05)}if(name==='clone'){hero.clones=3;hero.clone=7;toast('大品天仙诀·身外化身');for(let i=0;i<3;i++)ring(hero.x,hero.y,'#ffd971',90+i*25);tone(280,.35,'triangle',.05)}}
function chooseUpgrade(){paused=true;const picks=[...upgrades].sort(()=>Math.random()-.5).slice(0,3);ui.cards.innerHTML='';picks.forEach(u=>{const b=document.createElement('button');b.className='card';b.innerHTML=`<i>${u.icon}</i><b>${u.name}</b><span>${u.desc}</span>`;b.onclick=()=>{u.apply();ui.upgrade.classList.add('hide');paused=false;hero.hp=Math.min(hero.maxHp,hero.hp+15);toast(u.name+'·领悟');tone(520,.18,'triangle',.05);updateUI()};ui.cards.appendChild(b)});ui.upgrade.classList.remove('hide')}
function gainXP(v){hero.xp+=v;while(hero.xp>=hero.nextXp){hero.xp-=hero.nextXp;hero.level++;hero.nextXp=Math.round(hero.nextXp*1.28);chooseUpgrade();break}}
function update(dt){elapsed+=dt;hero.attack-=dt;hero.inv=Math.max(0,hero.inv-dt);hero.storm=Math.max(0,hero.storm-dt);hero.clone=Math.max(0,hero.clone-dt);if(hero.clone<=0)hero.clones=0;if(hero.regen)hero.hp=Math.min(hero.maxHp,hero.hp+hero.regen*dt);Object.keys(skillCD).forEach(k=>skillCD[k]=Math.max(0,skillCD[k]-dt));
 let mx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),my=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);if(mx||my){const l=Math.hypot(mx,my);hero.x+=mx/l*hero.speed*dt;hero.y+=my/l*hero.speed*dt;target.x=hero.x;target.y=hero.y}else if(dragging){hero.x+=(target.x-hero.x)*Math.min(1,dt*8);hero.y+=(target.y-hero.y)*Math.min(1,dt*8)}hero.x=clamp(hero.x,28,W-28);hero.y=clamp(hero.y,H*.2,H-58);
 const newWave=1+Math.floor(elapsed/22);if(newWave!==wave){wave=newWave;bossSpawned=false;toast(`第${cn(wave)}劫·妖气渐浓`)}spawnClock-=dt;const bossTime=elapsed%22>17;if(bossTime&&!bossSpawned&&!enemies.some(e=>e.boss)){spawnEnemy(true);bossSpawned=true}else if(spawnClock<=0&&!bossTime){spawnEnemy(false);spawnClock=Math.max(.24,1.05-wave*.055)}
 for(const e of enemies){const a=Math.atan2(hero.y-e.y,hero.x-e.x),d=dist(hero,e);e.phase+=dt*3;e.hit=Math.max(0,e.hit-dt);e.attack-=dt;if(d>hero.r+e.r+5){e.x+=Math.cos(a)*e.s*dt;e.y+=Math.sin(a)*e.s*dt}else if(e.attack<=0){e.attack=e.boss?.72:1.05;if(hero.inv<=0){const damage=e.damage*(1-hero.armor);hero.hp-=damage;hero.inv=.36;shake=e.boss?14:7;text(hero.x,hero.y-30,'-'+Math.round(damage),'#ff7668',16);burst(hero.x,hero.y,'#ff604d',10,130);tone(75,.12,'sawtooth',.05);if(hero.hp<=0){gameOver();return}}}if(e.boss)ui.bossFill.style.width=(e.hp/e.maxHp*100)+'%'}
 if(hero.attack<=0)attack();for(const o of orbs){o.vy+=55*dt;o.x+=o.vx*dt;o.y+=o.vy*dt;const d=dist(hero,o);if(d<hero.magnet){const s=Math.min(1,dt*(3+hero.magnet/80));o.x+=(hero.x-o.x)*s;o.y+=(hero.y-o.y)*s}if(d<hero.r+9){gainXP(o.value);o.dead=true;tone(620,.025,'sine',.012)}}orbs=orbs.filter(o=>!o.dead&&o.y<H+30);
 for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97}particles=particles.filter(p=>p.life>0);slashes.forEach(s=>s.life-=dt);slashes=slashes.filter(s=>s.life>0);rings.forEach(r=>{r.life-=dt;r.r+=(r.max-r.r)*dt*6});rings=rings.filter(r=>r.life>0);floaters.forEach(f=>{f.life-=dt;f.y-=28*dt});floaters=floaters.filter(f=>f.life>0);clouds.forEach(c=>{c.x+=c.v*dt;if(c.x>W+100)c.x=-150});if(hero.comboTime>0){hero.comboTime-=dt}else hero.combo=0;shake*=.88;flash=Math.max(0,flash-dt);updateUI()}
function cn(n){return ['零','一','二','三','四','五','六','七','八','九','十'][n]||n}
function updateUI(){ui.hp.style.width=(hero.hp/hero.maxHp*100)+'%';ui.hpNum.textContent=Math.max(0,Math.ceil(hero.hp));ui.xp.style.width=(hero.xp/hero.nextXp*100)+'%';ui.level.textContent=hero.level;ui.score.textContent=hero.score.toLocaleString();ui.combo.classList.toggle('show',hero.combo>=2);ui.comboNum.textContent='x'+hero.combo;ui.wave.textContent=`第${cn(wave)}劫`;const m=Math.floor(elapsed/60),s=Math.floor(elapsed%60);ui.timer.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;document.querySelectorAll('.skill').forEach(b=>{const k=b.dataset.skill,cd=skillCD[k],ratio=cd/skillMax[k];b.querySelector('.cool').style.transform=`scaleY(${ratio})`;b.querySelector('.cdtext').textContent=cd>0?cd.toFixed(cd<1?'1':'0'):''})}
function bg(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#071512');g.addColorStop(.55,'#17312a');g.addColorStop(1,'#26352d');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(const s of stars){ctx.globalAlpha=s.a;ctx.fillStyle='#e7edd7';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()}ctx.globalAlpha=1;const moonX=W*.77,moonY=H*.17,moonR=Math.min(W,H)*.075;ctx.fillStyle='#d8d2aa18';ctx.beginPath();ctx.arc(moonX,moonY,moonR*1.5,0,7);ctx.fill();ctx.fillStyle='#e8dfb5';ctx.beginPath();ctx.arc(moonX,moonY,moonR,0,7);ctx.fill();ctx.fillStyle='#c7c69b55';ctx.beginPath();ctx.arc(moonX-moonR*.3,moonY-moonR*.2,moonR*.18,0,7);ctx.fill();mountains(H*.55,'#13241f',.65,80);mountains(H*.66,'#192b25',.95,135);for(const c of clouds){ctx.globalAlpha=c.a;ctx.fillStyle='#e9f0e7';ctx.beginPath();ctx.ellipse(c.x,c.y,100*c.s,15*c.s,0,0,7);ctx.ellipse(c.x+65*c.s,c.y+4,70*c.s,10*c.s,0,0,7);ctx.fill()}ctx.globalAlpha=1;const road=ctx.createLinearGradient(0,H*.55,0,H);road.addColorStop(0,'#8b8a6940');road.addColorStop(1,'#c0a96a15');ctx.fillStyle=road;ctx.beginPath();ctx.moveTo(W*.44,H*.49);ctx.lineTo(W*.56,H*.49);ctx.lineTo(W*.92,H);ctx.lineTo(W*.08,H);ctx.closePath();ctx.fill();ctx.strokeStyle='#d9cc8a0b';ctx.lineWidth=1;for(let i=0;i<12;i++){const y=H*.52+i*i*3.4;ctx.beginPath();ctx.moveTo(W*.44-i*19,y);ctx.lineTo(W*.56+i*19,y);ctx.stroke()}}
function mountains(base,color,alpha,height){ctx.fillStyle=color;ctx.globalAlpha=alpha;ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(0,base);for(let x=0;x<=W+80;x+=80){const y=base-rnd(height*.25,height);ctx.lineTo(x+40,y);ctx.lineTo(x+80,base-rnd(0,25))}ctx.lineTo(W,H);ctx.closePath();ctx.fill();ctx.globalAlpha=1}
function drawEnemy(e){ctx.save();ctx.translate(e.x,e.y);if(e.hit)ctx.globalAlpha=.55;const bob=Math.sin(e.phase)*2;ctx.translate(0,bob);if(e.boss){ctx.shadowBlur=22;ctx.shadowColor='#df4638';ctx.fillStyle='#251415';ctx.beginPath();ctx.arc(0,0,e.r,0,7);ctx.fill();ctx.fillStyle='#d9c0a0';ctx.beginPath();ctx.moveTo(-30,-30);ctx.lineTo(-48,-58);ctx.lineTo(-16,-38);ctx.moveTo(30,-30);ctx.lineTo(48,-58);ctx.lineTo(16,-38);ctx.fill();ctx.shadowBlur=0}else{ctx.fillStyle=e.color;ctx.beginPath();ctx.arc(0,0,e.r,0,7);ctx.fill();ctx.fillStyle='#0005';ctx.beginPath();ctx.arc(0,5,e.r*.8,0,Math.PI);ctx.fill()}ctx.fillStyle='#fff0b5';ctx.beginPath();ctx.arc(-e.r*.32,-e.r*.13,e.boss?5:3,0,7);ctx.arc(e.r*.32,-e.r*.13,e.boss?5:3,0,7);ctx.fill();ctx.fillStyle='#a81818';ctx.beginPath();ctx.arc(-e.r*.32,-e.r*.13,1.5,0,7);ctx.arc(e.r*.32,-e.r*.13,1.5,0,7);ctx.fill();if(e.hp<e.maxHp){ctx.fillStyle='#0a0b0a99';ctx.fillRect(-e.r,e.r+8,e.r*2,4);ctx.fillStyle=e.boss?'#ee5c44':'#e8b752';ctx.fillRect(-e.r,e.r+8,e.r*2*e.hp/e.maxHp,4)}ctx.restore()}
function drawHero(){ctx.save();ctx.translate(hero.x,hero.y);if(hero.inv&&Math.floor(hero.inv*20)%2)ctx.globalAlpha=.35;ctx.shadowBlur=hero.storm?30:15;ctx.shadowColor=hero.storm?'#ffd363':'#e5b84966';if(hero.clones){for(let i=0;i<hero.clones;i++){const a=performance.now()/500+i*Math.PI*2/hero.clones;drawMonkey(Math.cos(a)*42,Math.sin(a)*20-5,.62,true)}}drawMonkey(0,0,1,false);ctx.restore()}
function drawMonkey(x,y,s,ghost){ctx.save();ctx.translate(x,y);ctx.scale(s,s);if(ghost)ctx.globalAlpha=.42;ctx.fillStyle='#aa3b28';ctx.fillRect(-14,3,28,28);ctx.fillStyle='#d7a34a';ctx.beginPath();ctx.arc(0,-6,18,0,7);ctx.fill();ctx.fillStyle='#6e3d24';ctx.beginPath();ctx.arc(0,-8,13,0,7);ctx.fill();ctx.fillStyle='#e6bd76';ctx.beginPath();ctx.ellipse(0,-5,9,11,0,0,7);ctx.fill();ctx.fillStyle='#171813';ctx.beginPath();ctx.arc(-3,-7,1.5,0,7);ctx.arc(3,-7,1.5,0,7);ctx.fill();ctx.strokeStyle='#f4d269';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,-10,16,Math.PI*1.08,Math.PI*1.92);ctx.stroke();ctx.strokeStyle='#c6402e';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-13,22);ctx.lineTo(-19,40);ctx.moveTo(13,22);ctx.lineTo(19,40);ctx.stroke();ctx.strokeStyle='#e8c568';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-30,20);ctx.lineTo(31,-30);ctx.stroke();ctx.strokeStyle='#c53a2b';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-36,25);ctx.lineTo(-27,17);ctx.moveTo(28,-27);ctx.lineTo(36,-35);ctx.stroke();ctx.restore()}
function draw(){ctx.save();if(shake)ctx.translate(rnd(-shake,shake),rnd(-shake,shake));bg();for(const o of orbs){ctx.shadowBlur=12;ctx.shadowColor='#ffdb6f';ctx.fillStyle='#ffe899';ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,7);ctx.fill()}ctx.shadowBlur=0;for(const r of rings){ctx.globalAlpha=r.life/.65;ctx.strokeStyle=r.color;ctx.lineWidth=3;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,7);ctx.stroke()}ctx.globalAlpha=1;enemies.forEach(drawEnemy);for(const s of slashes){ctx.globalAlpha=s.life/.2;ctx.strokeStyle='#ffe59e';ctx.lineWidth=8*s.life/.2;ctx.beginPath();ctx.arc(s.x,s.y,s.len,-.7+s.a,.7+s.a);ctx.stroke()}ctx.globalAlpha=1;drawHero();for(const p of particles){ctx.globalAlpha=Math.min(1,p.life/p.max);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}for(const f of floaters){ctx.globalAlpha=f.life/.8;ctx.fillStyle=f.color;ctx.font=`700 ${f.size}px Georgia`;ctx.textAlign='center';ctx.fillText(f.value,f.x,f.y)}ctx.globalAlpha=1;if(hero.storm){ctx.strokeStyle='#ffd76bbb';ctx.lineWidth=4;for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(hero.x,hero.y,hero.range*(.45+i*.3),performance.now()/220+i,performance.now()/220+i+4.4);ctx.stroke()}}ctx.restore();if(flash){ctx.fillStyle=`rgba(255,233,166,${flash})`;ctx.fillRect(0,0,W,H)}}
function gameOver(){running=false;paused=true;ui.boss.classList.remove('show');const best=Math.max(Number(localStorage.getItem('xiyou-best')||0),hero.score);localStorage.setItem('xiyou-best',best);$('#result').innerHTML=`${hero.score.toLocaleString()}<small>本局功德</small>`;$('#record').textContent=hero.score>=best?'新纪录·功德无量':`最高功德：${best.toLocaleString()}`;ui.over.classList.remove('hide');tone(90,.6,'sawtooth',.06)}
function loop(now){if(!running)return;const dt=Math.min(.033,(now-last)/1000||0);last=now;if(!paused)update(dt);draw();requestAnimationFrame(loop)}
function pointer(e){const r=canvas.getBoundingClientRect(),p=e.touches?e.touches[0]:e;target.x=clamp(p.clientX-r.left,25,W-25);target.y=clamp(p.clientY-r.top,H*.2,H-55)}
canvas.addEventListener('pointerdown',e=>{dragging=true;pointer(e)});addEventListener('pointermove',e=>{if(dragging)pointer(e)});addEventListener('pointerup',()=>dragging=false);addEventListener('keydown',e=>{keys[e.key]=true;if(e.key==='1')useSkill('dash');if(e.key==='2')useSkill('storm');if(e.key==='3')useSkill('clone');if(e.key==='Escape'&&running)togglePause()});addEventListener('keyup',e=>keys[e.key]=false);
document.querySelectorAll('.skill').forEach(b=>b.addEventListener('pointerdown',e=>{e.stopPropagation();useSkill(b.dataset.skill)}));
function togglePause(){if(!running)return;paused=!paused;ui.pause.classList.toggle('hide',!paused)}
$('#startBtn').onclick=startGame;$('#restartBtn').onclick=startGame;$('#resumeBtn').onclick=togglePause;$('#pauseBtn').onclick=togglePause;$('#soundBtn').onclick=()=>{muted=!muted;$('#soundBtn').style.opacity=muted?.45:1;toast(muted?'已静音':'声音已开')};$('#fullBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{if(document.hidden&&running&&!paused)togglePause()});resize();draw();
})();
</script>
